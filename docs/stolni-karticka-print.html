<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<title>Enotéka — stolní kartička QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
<style>
  @page { size: 148mm 210mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 148mm;
    height: 210mm;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    background: #F6F3EC;
  }

  .sheet { position: relative; width: 148mm; height: 210mm; overflow: hidden; }

  .panel {
    position: absolute;
    left: 0;
    width: 148mm;
    height: 105mm;
    background: #1E1F21;
    color: #F6F3EC;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8mm 10mm;
  }

  .panel--top { top: 0; }
  .panel--bottom { top: 105mm; transform: rotate(180deg); }

  .mark {
    width: 8mm;
    height: 8mm;
    margin-bottom: 3mm;
  }
  .mark circle { fill: none; stroke: #8CA334; stroke-width: 1.3; opacity: 0.8; }
  .mark .berry { fill: #8CA334; }

  .eyebrow {
    font-family: 'Jost', sans-serif;
    font-size: 8.5pt;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #8CA334;
    margin-bottom: 2mm;
  }

  .wordmark { line-height: 0; }

  .logo {
    width: 50mm;
    height: auto;
    filter: brightness(0) invert(1);
  }

  .qr-frame {
    background: #FFFFFF;
    padding: 3.2mm;
    border-radius: 2mm;
    margin: 5mm 0 4mm;
    line-height: 0;
  }
  .qr-frame img { width: 30mm; height: 30mm; display: block; }

  .cta {
    font-family: 'Jost', sans-serif;
    font-weight: 600;
    font-size: 12pt;
    letter-spacing: 0.02em;
    color: #FFFFFF;
    margin-bottom: 1.5mm;
  }

  .url {
    font-family: 'Jost', sans-serif;
    font-size: 9pt;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: #8CA334;
    margin-bottom: 3mm;
  }

  .place {
    font-size: 7.5pt;
    color: rgba(246,243,236,0.5);
    letter-spacing: 0.02em;
  }

  .fold-guide {
    position: absolute;
    top: 105mm;
    left: 0;
    width: 148mm;
    height: 0;
    border-top: 0.3mm dashed rgba(140,163,52,0.5);
    z-index: 5;
  }
</style>
</head>
<body>
  <div class="sheet">

    <div class="panel panel--top">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18"/>
        <circle class="berry" cx="20" cy="13" r="2.6"/>
        <circle class="berry" cx="14" cy="18" r="2.6"/>
        <circle class="berry" cx="26" cy="18" r="2.6"/>
        <circle class="berry" cx="20" cy="23" r="2.6"/>
        <circle class="berry" cx="14" cy="27" r="2.2"/>
        <circle class="berry" cx="26" cy="27" r="2.2"/>
      </svg>
      <p class="eyebrow">Vinotrh · Znojmo</p>
      <h1 class="wordmark"><img class="logo" src="../assets/images/logo/enoteka-logo.png" alt="Enotéka znojemských vín" /></h1>
      <div class="qr-frame"><img src="qr/qr-menu-vinotrh.png" alt="QR kód na nápojový lístek" /></div>
      <p class="cta">Naskenujte pro nápojový lístek</p>
      <p class="url">menu.vinotrh.cz</p>
      <p class="place">Hradní ulice — areál pivovaru, Znojmo</p>
    </div>

    <div class="panel panel--bottom">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18"/>
        <circle class="berry" cx="20" cy="13" r="2.6"/>
        <circle class="berry" cx="14" cy="18" r="2.6"/>
        <circle class="berry" cx="26" cy="18" r="2.6"/>
        <circle class="berry" cx="20" cy="23" r="2.6"/>
        <circle class="berry" cx="14" cy="27" r="2.2"/>
        <circle class="berry" cx="26" cy="27" r="2.2"/>
      </svg>
      <p class="eyebrow">Vinotrh · Znojmo</p>
      <h1 class="wordmark"><img class="logo" src="../assets/images/logo/enoteka-logo.png" alt="Enotéka znojemských vín" /></h1>
      <div class="qr-frame"><img src="qr/qr-menu-vinotrh.png" alt="QR kód na nápojový lístek" /></div>
      <p class="cta">Naskenujte pro nápojový lístek</p>
      <p class="url">menu.vinotrh.cz</p>
      <p class="place">Hradní ulice — areál pivovaru, Znojmo</p>
    </div>

    <div class="fold-guide"></div>

  </div>
</body>
</html>
